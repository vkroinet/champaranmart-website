<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Login | Champaran Mart</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --ink:#1A1523; --muted:#6B6478; --paper:#FFFDF9; --surface:#FFF1EC;
    --brand:#D6304A; --accent:#FFB020; --border:#EFE1DC; --card:#FFFFFF; --err:#B3261E; --ok:#1E7A4A;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F5F1EC; --muted:#C9C2D6; --paper:#150F19; --surface:#241A22;
      --brand:#FF6B84; --accent:#FFC65C; --border:#3A2C36; --card:#1F1720; --err:#FF9C94; --ok:#6FD39B;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;margin:0 0 2px;text-wrap:balance}
  .wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
  nav{border-bottom:1px solid var(--border)}
  nav .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
  .brand-mark{display:flex;align-items:center;gap:9px;text-decoration:none}
  .brand-mark img{width:34px;height:34px;border-radius:50%}
  .brand-mark span{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--ink)}
  .navlinks{display:flex;gap:22px;list-style:none;margin:0;padding:0;align-items:center}
  .navlinks a{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
  .navlinks a:hover{color:var(--brand)}
  .navlinks a.navlogin{background:var(--brand);color:#fff;padding:7px 18px;border-radius:999px}
  @media (max-width:560px){.navlinks li.hide-sm{display:none}}
  .page{display:flex;justify-content:center;padding:44px 16px 64px}
  .card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
  .sub{color:var(--muted);margin:0 0 18px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px}
  .tab{border:none;background:transparent;border-radius:9px;padding:9px 6px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .tab[aria-selected="true"]{background:var(--brand);color:#fff}
  .soon{font-size:10px;font-weight:800;background:var(--accent);color:#3a2a00;border-radius:999px;padding:1px 7px}
  label{display:block;font-weight:700;font-size:13px;margin:0 0 4px}
  input{width:100%;height:44px;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit}
  input:focus,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .field{margin-bottom:14px}
  .pw{position:relative}
  .pw input{padding-right:46px}
  .eye{position:absolute;right:4px;top:4px;height:36px;width:38px;border:none;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;font-weight:700}
  .btn{width:100%;height:46px;border:none;border-radius:999px;background:var(--brand);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:4px}
  .btn:hover{filter:brightness(.93)}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin:8px 0 6px;font-size:13.5px;color:var(--err)}
  .msg.ok{color:var(--ok)}
  .links{display:flex;justify-content:space-between;font-size:13.5px;margin:2px 0 6px}
  .links a,.links button{color:var(--brand);font:inherit;font-weight:700;background:none;border:none;padding:0;cursor:pointer;text-decoration:none}
  .note{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<nav>
  <div class="wrap row">
    <a href="/" class="brand-mark"><img src="/favicon-96.png" alt="" width="34" height="34"><span>Champaran Mart</span></a>
    <ul class="navlinks">
      <li class="hide-sm"><a href="/">Home</a></li>
      <li class="hide-sm"><a href="/#contact">Contact</a></li>
      <li><a class="navlogin" href="/login/" aria-current="page">Login</a></li>
    </ul>
  </div>
</nav>

<div class="page">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Apne account me login karo.</p>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-admin" aria-selected="true" aria-controls="p-admin" type="button">Admin</button>
      <button class="tab" role="tab" id="tab-cust" aria-selected="false" aria-controls="p-cust" type="button">Customer <span class="soon">jald</span></button>
    </div>

    <form id="p-admin" role="tabpanel" aria-labelledby="tab-admin" novalidate>
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="admin@champaranmart.com"></div>
      <div class="field"><label for="pw">Password</label>
        <div class="pw"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button class="eye" type="button" id="eye" aria-label="Password dikhao">Dikhao</button></div></div>
      <div class="links"><span></span><button type="button" id="forgot">Password bhool gaye?</button></div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn" id="go" type="submit">Admin login</button>
    </form>

    <div id="p-cust" role="tabpanel" aria-labelledby="tab-cust" hidden>
      <div class="field"><label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="tel" placeholder="+91 98765 43210" disabled></div>
      <button class="btn" type="button" disabled>OTP bhejo</button>
      <p class="note">Customer login website par jald aayega. Abhi app se order karo.</p>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, doc, getDoc } from "/admin/js/fb.js";

const $ = (id) => document.getElementById(id);
const msg = $("msg");
let signingIn = false;
const say = (t, ok) => { msg.textContent = t; msg.className = "msg" + (ok ? " ok" : ""); };

function tab(admin) {
  $("tab-admin").setAttribute("aria-selected", admin);
  $("tab-cust").setAttribute("aria-selected", !admin);
  $("p-admin").hidden = !admin;
  $("p-cust").hidden = admin;
}
$("tab-admin").onclick = () => tab(true);
$("tab-cust").onclick = () => tab(false);
$("eye").onclick = () => {
  const show = $("pw").type === "password";
  $("pw").type = show ? "text" : "password";
  $("eye").textContent = show ? "Chhupao" : "Dikhao";
};
$("em").oninput = $("pw").oninput = () => say("");

function friendly(e) {
  const c = (e && e.code) || "";
  if (c === "auth/invalid-email") return "Email sahi nahi hai. Dobara check karo.";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"].includes(c)) return "Email ya password galat hai. Dobara try karo.";
  if (c === "auth/too-many-requests") return "Bahut zyada koshish ho gayi. Thodi der baad try karo.";
  if (c === "auth/network-request-failed") return "Internet nahi chal raha. Check karke dobara try karo.";
  if (c === "auth/api-key-not-valid" || c === "auth/invalid-api-key") return "Website ka Firebase setup poora nahi hai. Developer se baat karo.";
  if (c === "auth/unauthorized-domain") return "Ye website Firebase me allow nahi hai (Authorized domains me champaranmart.com jodo).";
  return "Login nahi ho paya. Dobara try karo.";
}

async function isAdmin(uid) {
  const s = await getDoc(doc(db, "users", uid));
  return s.exists() && s.data().role === "admin";
}

$("p-admin").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = $("em").value.trim(), pass = $("pw").value;
  if (!email) return say("Email daalo.");
  if (!/^\S+@\S+\.\S+$/.test(email)) return say("Email sahi nahi hai. Dobara check karo.");
  if (!pass) return say("Password daalo.");
  const btn = $("go");
  btn.disabled = true; btn.textContent = "Check ho raha hai…"; say("");
  signingIn = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    if (await isAdmin(cred.user.uid)) {
      say("Login ho gaya. Dashboard khul raha hai…", true);
      location.replace("/admin/");
      return;
    }
    await signOut(auth);
    say("Is account ko admin access nahi hai. Sirf admin login kar sakta hai.");
  } catch (e) {
    console.error(e);
    say(e && e.code && e.code.startsWith("auth/") ? friendly(e) : "Login nahi ho paya. Dobara try karo.");
  } finally {
    signingIn = false;
    btn.disabled = false; btn.textContent = "Admin login";
  }
});

$("forgot").onclick = async () => {
  const email = $("em").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return say("Pehle apna email daalo, fir reset link bhejenge.");
  try {
    await sendPasswordResetEmail(auth, email);
    say("Agar ye email registered hai to reset link bhej diya gaya hai.", true);
  } catch (e) {
    say(friendly(e));
  }
};

if (new URLSearchParams(location.search).get("denied")) say("Is account ko admin access nahi hai.");

// Already signed in as admin from earlier: go straight to the dashboard.
onAuthStateChanged(auth, async (user) => {
  if (!user || signingIn) return;
  try {
    if (await isAdmin(user.uid)) location.replace("/admin/");
  } catch (e) { /* stay on the login page */ }
});
</script>
</body>
</html>
