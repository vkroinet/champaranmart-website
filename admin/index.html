<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Champaran Mart</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="boot" id="boot">Checking your login…</div>

<div class="app" id="app">
  <aside class="side" id="side">
    <a class="brand" href="#/"><img src="/favicon-96.png" alt="" width="34" height="34"><span>Champaran Mart</span></a>
    <nav id="nav" aria-label="Admin sections"></nav>
  </aside>
  <div class="col">
    <header class="top" id="top">
      <form class="search" id="search" role="search"><i class="ti ti-search"></i><input id="q" type="search" placeholder="Search order no. or phone" aria-label="Search orders" autocomplete="off"></form>
      <div class="sp"></div>
      <label class="shop" id="shop" title="Turn this off to stop all new orders"><span class="sw"><input type="checkbox" id="shopOn" checked><span></span></span><span id="shopLbl">Taking orders</span></label>
      <div class="av" id="who" title="">A</div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<nav class="mbar" id="mbar" aria-label="Main"></nav>
<div class="sheet" id="sheet"><div class="sh" id="sheetBody"></div></div>

<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
